name: Build iPhone app
on:
  push:
  workflow_dispatch:
jobs:
  ipa:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Unpack the game
        run: |
          cat www.zip.0* > www.zip && mkdir -p www && unzip -q www.zip -d www
          # where the app checks for over-the-air updates: this repository's GitHub Pages site
          echo "{\"base\":\"https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/\"}" > www/ota.json
      - name: Install Capacitor
        run: npm install
      - name: Create the iOS project
        run: npx cap add ios
      - name: App icon, portrait only, no status bar
        run: |
          cp icon-1024.png ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png
          P=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations" $P || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations array" $P
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:0 string UIInterfaceOrientationPortrait" $P
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations~ipad" $P || true
          /usr/libexec/PlistBuddy -c "Add :UIStatusBarHidden bool true" $P || /usr/libexec/PlistBuddy -c "Set :UIStatusBarHidden true" $P
          /usr/libexec/PlistBuddy -c "Add :UIViewControllerBasedStatusBarAppearance bool false" $P || /usr/libexec/PlistBuddy -c "Set :UIViewControllerBasedStatusBarAppearance false" $P
          /usr/libexec/PlistBuddy -c "Add :UIRequiresFullScreen bool true" $P || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Grand Line Blazing" $P || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string Grand Line Blazing" $P
      - name: Copy the game into the app
        run: npx cap sync ios
      - name: Build (unsigned; Sideloadly signs it with your Apple ID)
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos \
            -archivePath "$PWD/build/App.xcarchive" archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" | tail -n 40
          mkdir -p Payload
          cp -R build/App.xcarchive/Products/Applications/App.app Payload/
          zip -qr GrandLineBlazing.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: GrandLineBlazing-ipa
          path: ios/App/GrandLineBlazing.ipa
  # over-the-air update feed: version.json and the game bundle on GitHub Pages
  updates:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - name: Build the update bundle
        run: |
          cat www.zip.0* > www.zip && mkdir -p site tmp && unzip -q www.zip -d tmp
          echo "{\"base\":\"https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/\"}" > tmp/ota.json
          (cd tmp && zip -qr ../site/www.zip .)
          cp version.json site/version.json
          touch site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
